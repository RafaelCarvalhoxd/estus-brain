# Só para rodar na máquina. Em produção cada serviço é um app do Cubeship,
# construído pelo Dockerfile, e o banco é o gerenciado por ele.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estus
      POSTGRES_PASSWORD: estus
      POSTGRES_DB: estus_vault
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - estus_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estus -d estus_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://estus:estus@postgres:5432/estus_vault?sslmode=disable
      # Senha de login do app, pedida de novo para revelar uma senha do cofre.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Cofre de senhas — deixe em branco para rodar sem esse módulo.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      AGENT_URL: ${AGENT_URL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - estus_vault_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  estus_vault_pgdata:
  estus_vault_data:
