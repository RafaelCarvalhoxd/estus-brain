services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estus
      POSTGRES_PASSWORD: estus
      POSTGRES_DB: estus_vault
    ports:
      - "5434:5432"
    volumes:
      - estus_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estus -d estus_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://estus:estus@postgres:5432/estus_vault?sslmode=disable
      # Senha de login do app, pedida de novo para revelar uma senha do cofre.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Cofre de senhas — deixe em branco para rodar sem esse módulo.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      # Agenda / Google Calendar — deixe em branco para rodar só localmente.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/google/oauth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  estus_vault_pgdata:
