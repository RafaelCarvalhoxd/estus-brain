services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estus
      POSTGRES_PASSWORD: estus
      POSTGRES_DB: estus_vault
    ports:
      - "5434:5432"
    volumes:
      - estus_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estus -d estus_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://estus:estus@postgres:5432/estus_vault?sslmode=disable
      # Cofre de senhas — deixe em branco para rodar sem esse módulo.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      # Agenda / Google Calendar — deixe em branco para rodar só localmente.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/google/oauth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    # Só em loopback: em produção o único jeito de entrar é pelo Caddy, que
    # fala com este serviço pela rede interna do compose, não pela porta
    # publicada no host.
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  # Borda mTLS: único serviço exposto publicamente (80/443). Emite o
  # certificado HTTPS de verdade (Let's Encrypt, via DOMAIN) e só repassa a
  # requisição para o frontend depois de validar um certificado de cliente
  # assinado pela CA em deploy/mtls/ca/ca.crt — ver "Deploy com mTLS" no
  # README. Fica atrás do profile "mtls": `docker compose up --build`
  # sozinho (uso local) não sobe nem exige DOMAIN; produção usa
  # `docker compose --profile mtls up -d --build`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["mtls"]
    environment:
      # Obrigatório só quando você de fato sobe este serviço (profile mtls) —
      # ver "Deploy com mTLS" no README.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/mtls/ca:/mtls:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  estus_vault_pgdata:
  caddy_data:
  caddy_config:
