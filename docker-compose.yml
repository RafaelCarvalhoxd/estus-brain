# Deploy (Cubeship/Dokploy): só o frontend recebe domínio, na porta 3000.
# Backend e Postgres ficam na rede interna. Variáveis vêm do painel (ou de
# um .env ao lado deste arquivo).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estus}
      POSTGRES_DB: estus_vault
    volumes:
      - estus_vault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estus -d estus_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://estus:${POSTGRES_PASSWORD:-estus}@postgres:5432/estus_vault?sslmode=disable
      # Senha de login do app, pedida de novo para revelar uma senha do cofre.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Cofre de senhas — deixe em branco para rodar sem esse módulo.
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      DOCUMENTS_DIR: /app/data/documents
      ASSISTANT_DIR: /app/data/assistant
      MCP_TOKEN: ${MCP_TOKEN:-}
      ASSISTANT_TZ: ${ASSISTANT_TZ:-America/Sao_Paulo}
      AGENT_URL: ${AGENT_URL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - estus_vault_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:-}
    depends_on:
      - backend
    expose:
      - "3000"

volumes:
  estus_vault_pgdata:
  estus_vault_data:
