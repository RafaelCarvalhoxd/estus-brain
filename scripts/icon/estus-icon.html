<style>
  html,body{margin:0;padding:0;background:transparent}
  svg{display:block}
</style>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1b2030"/>
      <stop offset="55%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%"   stop-color="#7aa2ff" stop-opacity=".40"/>
      <stop offset="55%"  stop-color="#4668c8" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#4668c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9cdff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- placa do ícone (squircle aproximado por rect arredondado) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#glow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.5"
        fill="none" stroke="#8fa6d8" stroke-opacity=".18" stroke-width="3"/>

  <!-- brilho por trás do cérebro -->
  <g filter="url(#soft)" opacity=".85">
    <use href="#hemi" fill="#6d8fff" opacity=".55"/>
    <use href="#hemi" fill="#6d8fff" opacity=".55" transform="translate(1024,0) scale(-1,1)"/>
  </g>

  <!-- meio hemisfério, desenhado uma vez e espelhado -->
  <defs>
    <path id="hemi" d="
      M 512 286
      C 566 256 640 258 676 300
      C 736 288 788 328 788 386
      C 828 410 834 470 800 502
      C 822 540 808 594 768 612
      C 762 668 714 702 662 692
      C 630 736 556 742 520 710
      L 520 286 Z"/>
    <path id="folds" d="
      M 560 320 C 612 334 630 372 604 404 C 578 436 596 470 640 478
      M 700 352 C 668 382 676 416 712 430
      M 604 528 C 652 540 668 578 640 606
      M 726 500 C 700 530 708 566 742 578
      M 566 620 C 604 632 618 662 600 686"/>
  </defs>

  <g>
    <use href="#hemi" fill="url(#ink)"/>
    <use href="#hemi" fill="url(#ink)" transform="translate(1024,0) scale(-1,1)"/>

    <!-- fissura central -->
    <rect x="504" y="286" width="16" height="430" fill="#0d1017" opacity=".9"/>

    <!-- dobras -->
    <g fill="none" stroke="#0d1017" stroke-opacity=".62" stroke-width="17"
       stroke-linecap="round" stroke-linejoin="round">
      <use href="#folds"/>
      <use href="#folds" transform="translate(1024,0) scale(-1,1)"/>
    </g>

    <!-- tronco -->
    <path d="M 486 706 h 52 v 92 q 0 26 -26 26 q -26 0 -26 -26 Z" fill="url(#ink)"/>
  </g>
</svg>
